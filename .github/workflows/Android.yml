name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;21.4.7075529"

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "PATH=$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV

      - name: Install Haxelib dependencies
        run: |
          haxelib setup ~/haxelib

          haxelib install hxpkg --always
          haxelib run hxpkg install

      - name: Install Lime
        run: |
          haxelib install lime 8.1.3 --always
          haxelib set lime 8.1.3

      - name: Install OpenFL
        run: |
          haxelib install openfl 9.5.0 --always
          haxelib set openfl 9.5.0

      - name: Setup Lime Android
        run: |
          haxelib run lime setup android

      - name: Build Android
        run: |
          haxelib run lime build android -release

      - name: Find APK
        run: |
          echo "APK files:"
          find export -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BBif-Demo-Android
          path: |
            export/**/*.apk
            export/**/**/*.apk
          if-no-files-found: error
