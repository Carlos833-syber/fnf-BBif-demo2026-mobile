name: Build BBif Demo Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe 4.3.7
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.7'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;21.4.7075529"

      - name: Configure Android
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Show Android versions
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          adb version || true
          "$ANDROID_NDK_ROOT/ndk-build" --version || true

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install hxpkg
        run: |
          haxelib install hxpkg --always

      - name: Install project dependencies
        run: |
          haxelib run hxpkg install

      - name: Install Lime
        run: |
          haxelib install lime 8.1.3 --always
          haxelib set lime 8.1.3

      - name: Install OpenFL
        run: |
          haxelib install openfl 9.5.0 --always
          haxelib set openfl 9.5.0

      - name: Setup Lime Android
        run: |
          haxelib run lime setup android

      - name: Build APK
        run: |
          haxelib run lime build android -release

      - name: Find APK
        run: |
          echo "===== APK ====="
          find export -type f -name "*.apk" -print || true
          echo "=============="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BBif-Demo-Android
          path: export/**/*.apk
          if-no-files-found: error
