name: Build BBif Demo Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      HAXELIB_PATH: ${{ github.workspace }}/haxelib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.7'

      # --------------------------------------------------
      # ANDROID
      # --------------------------------------------------

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ -z "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID SDK:"
          ls -la "$ANDROID_SDK_ROOT"

      - name: Show installed Android packages
        shell: bash
        run: |
          set +e

          sdkmanager --list_installed 2>/dev/null || true

          echo ""
          echo "Platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || true

          echo ""
          echo "Build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null || true

          echo ""
          echo "NDK:"
          ls -la "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || true

      - name: Install Android platform/build tools
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find Android NDK
        shell: bash
        run: |
          set -e

          NDK_DIR="$ANDROID_SDK_ROOT/ndk"

          if [ -d "$NDK_DIR/21.4.7075529" ]; then
            NDK="$NDK_DIR/21.4.7075529"
          elif [ -d "$NDK_DIR/27.2.12479018" ]; then
            NDK="$NDK_DIR/27.2.12479018"
          else
            echo "NDK 21.4.7075529/27.2.12479018 não encontrado."
            echo "Instalando NDK 21.4.7075529..."

            yes | sdkmanager "ndk;21.4.7075529"

            NDK="$NDK_DIR/21.4.7075529"
          fi

          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo ""
          echo "NDK selecionado:"
          echo "$NDK"

      # --------------------------------------------------
      # HAXE
      # --------------------------------------------------

      - name: Configure Haxelib
        shell: bash
        run: |
          mkdir -p "$HAXELIB_PATH"
          haxelib setup "$HAXELIB_PATH"

      - name: Install hxpkg
        shell: bash
        run: |
          haxelib install hxpkg --always

      - name: Install project dependencies
        shell: bash
        run: |
          haxelib run hxpkg install

      - name: Install Lime
        shell: bash
        run: |
          haxelib install lime 8.1.3 --always
          haxelib set lime 8.1.3

      - name: Install OpenFL
        shell: bash
        run: |
          haxelib install openfl 9.5.0 --always
          haxelib set openfl 9.5.0

      # --------------------------------------------------
      # LIME ANDROID
      # --------------------------------------------------

      - name: Setup Lime
        shell: bash
        run: |
          haxelib run lime setup

      - name: Setup Lime Android
        shell: bash
        run: |
          haxelib run lime setup android

      # --------------------------------------------------
      # BUILD
      # --------------------------------------------------

      - name: Build Android Release
        shell: bash
        run: |
          haxelib run lime build android -release

      # --------------------------------------------------
      # APK
      # --------------------------------------------------

      - name: Locate APK
        shell: bash
        run: |
          echo "Procurando APK..."

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BBif-Demo-Android
          path: |
            export/**/*.apk
            export/**/**/*.apk
            export/**/*.apk
          if-no-files-found: error
